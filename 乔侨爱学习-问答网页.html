<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>乔侨爱学习 · 业务问答</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6f8; color: #1f2329; }
.app { max-width: 760px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
header { padding: 16px 18px 10px; background: #fff; border-bottom: 1px solid #eee; }
header h1 { margin: 0; font-size: 18px; }
.sub { margin: 4px 0 8px; color: #8a9099; font-size: 13px; }
.bar { font-size: 12px; color: #8a9099; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.bar select { font-size: 12px; padding: 2px 6px; }
main { flex: 1; overflow-y: auto; padding: 16px; }
.msg { margin-bottom: 14px; max-width: 92%; }
.msg.user { margin-left: auto; }
.bubble { padding: 10px 13px; border-radius: 12px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
.msg.user .bubble { background: #4c6ef5; color: #fff; border-bottom-right-radius: 3px; }
.msg.bot .bubble { background: #fff; border: 1px solid #eee; border-bottom-left-radius: 3px; }
.bubble .src { display: block; margin-top: 6px; font-size: 12px; color: #aaa; }
footer { display: flex; gap: 8px; padding: 12px; background: #fff; border-top: 1px solid #eee; }
#q { flex: 1; padding: 11px 13px; border: 1px solid #ddd; border-radius: 10px; font-size: 14px; outline: none; }
#send { padding: 0 18px; border: 0; border-radius: 10px; background: #4c6ef5; color: #fff; font-size: 14px; cursor: pointer; }

</style>
</head>
<body>
<div class="app">
  <header>
    <h1>乔侨爱学习 · 业务问答</h1>
    <p class="sub">问学费 / 学位 / 备案，或"按XX风格写"。纯前端检索，数据不出本机 · 演示数据。</p>
    <div class="bar">
      <label>数据源：<select id="src"><option value="sample">示例数据（演示）</option><option value="app">本机真实数据</option></select></label>
      <span id="stat"></span>
    </div>
  </header>
  <main id="log"></main>
  <footer>
    <input id="q" placeholder="例如：广开土木工程学费多少 / 按示例-文老师的风格写一条" autocomplete="off">
    <button id="send">发送</button>
  </footer>
</div>
<script>
window.SAMPLE_DATA = {"kb": [{"类型": "国开", "院校": "国家开放大学（示例）", "专业": "畜牧兽医（示例）", "层次": "高起专", "学制": "2.5年", "第一学年学费": "3420元/年", "第二学年学费": "3420元/年", "教材费": "500元/年", "文本": "【示例数据】国开畜牧兽医：学制2.5年，学费3420元/年、只收两年，教材费500元/年，直接交学校。"}, {"类型": "广开", "院校": "广东开放大学（示例）", "专业": "土木工程（示例）", "层次": "本科", "学制": "2.5年", "收费标准": "8591", "第一次收费": "3436", "第二次收费": "3436", "第三次收费": "1719", "文本": "【示例数据】广开土木工程本科：总收费8591，分三次交 3436/3436/1719。"}], "degree": [{"学校": "示例大学", "项目": "学位外语", "要求": "【示例】成绩60分以上（100分制，60为及格线）。", "注意事项": "示例"}], "affiliation": [{"单位名称": "示例培训中心", "高校": "示例高校"}], "cards": [{"name": "示例-文老师（演示）", "owner": "示例", "text": "# 风格卡：示例-文老师（演示，非真实）\n\n## 人称\n第三人称「老师」口播。\n## 钩子\n开头直接抛痛点。\n## 结尾\n收藏这条，关注老师。\n\n> 这是演示卡，真实数据请运行 scripts/export_web_data.py 后打开网页。"}]};

</script>
<script>
'use strict';

function getData() {
  const which = document.getElementById('src').value;
  if (which === 'app') {
    if (typeof window.APP_DATA === 'undefined') {
      return { error: '还没生成真实数据。请在本机运行 scripts/export_web_data.py，然后刷新页面；当前已切回「示例数据」。' };
    }
    return window.APP_DATA;
  }
  return window.SAMPLE_DATA || { kb: [], degree: [], affiliation: [], cards: [] };
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function addMsg(role, text) {
  const log = document.getElementById('log');
  const m = document.createElement('div');
  m.className = 'msg ' + role;
  const b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = esc(text).replace(/\n/g, '<br>');
  m.appendChild(b);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
}

function updateStat(DATA) {
  document.getElementById('stat').textContent =
    '资料：简章 ' + (DATA.kb || []).length + ' 条 · 政策 ' + (DATA.degree || []).length +
    ' 条 · 风格卡 ' + (DATA.cards || []).length + ' 张';
}

// 中文检索：2-4 字滑窗分词
function tokens(q) {
  const clean = q.replace(/[\s\p{P}]+/gu, '');
  const out = new Set();
  for (let i = 0; i < clean.length; i++) {
    for (let n = 2; n <= Math.min(4, clean.length - i); n++) {
      out.add(clean.substr(i, n));
    }
  }
  return [...out];
}

function search(blocks, q) {
  const toks = tokens(q);
  const scored = [];
  for (const b of blocks) {
    const text = (typeof b === 'string' ? b : JSON.stringify(b));
    let score = 0;
    for (const t of toks) if (text.includes(t)) score += t.length;
    if (score > 0) scored.push({ b, score });
  }
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, 4);
}

function blockText(b) {
  if (typeof b === 'string') return b;
  if (b.text) return b.text;
  return Object.entries(b).map(([k, v]) => k + '：' + v).join('；');
}

function answer(DATA, q) {
  // 「有哪些 / 列出」清单类意图
  if (/有哪些|列出|全部|所有|清单|列表/.test(q)) {
    if (/备案|教学点|中心/.test(q) && (DATA.affiliation || []).length) {
      return '备案教学点（共 ' + DATA.affiliation.length + ' 条）：\n\n' +
        DATA.affiliation.map(a => '· ' + blockText(a)).join('\n');
    }
    if (/风格|账号/.test(q) && (DATA.cards || []).length) {
      return '已训练风格卡（共 ' + DATA.cards.length + ' 张）：\n\n' +
        DATA.cards.map(c => '· ' + c.name + (c.owner ? '（' + c.owner + '）' : '')).join('\n');
    }
  }
  // 风格写稿意图
  const styleMatch = q.match(/按(.+?)的风格|(.+?)风格写|写一条|写3条|写三?条/);
  if (styleMatch) {
    const name = (styleMatch[1] || styleMatch[2] || '').trim();
    const cards = (DATA.cards || []).filter(c => !name || c.name.includes(name));
    if (cards.length) {
      let s = '找到 ' + cards.length + ' 张风格卡' + (name ? '（匹配「' + name + '」）' : '') + '：\n\n';
      s += cards.slice(0, 3).map(c => '【' + c.name + '】\n' + (c.text || '').slice(0, 500)).join('\n\n---\n\n');
      s += '\n\n（轻量版展示写法说明；把这段贴给大模型即可照写。接大模型后可自动成稿。）';
      return s;
    }
    return '没有匹配到风格卡。可用的：' + (DATA.cards || []).map(c => c.name).join('、');
  }
  const blocks = [...(DATA.kb || []), ...(DATA.degree || []), ...(DATA.affiliation || [])];
  const hits = search(blocks, q);
  if (!hits.length) {
    return '没在资料里查到相关内容。试试更具体的关键词（学校名+专业/学费/学位/备案）。\n已收录：简章 ' +
      (DATA.kb || []).length + ' 条，政策 ' + (DATA.degree || []).length + ' 条。';
  }
  return '我查到这些（来自业务资料）：\n\n' + hits.map(h => '· ' + blockText(h.b).slice(0, 320)).join('\n\n');
}

function send() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  document.getElementById('q').value = '';
  addMsg('user', q);
  const DATA = getData();
  if (DATA.error) {
    document.getElementById('src').value = 'sample';
    addMsg('bot', DATA.error);
    updateStat(getData());
    return;
  }
  setTimeout(() => addMsg('bot', answer(DATA, q)), 120);
}

document.getElementById('send').addEventListener('click', send);
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
document.getElementById('src').addEventListener('change', () => updateStat(getData()));

// 启动
const boot = getData();
if (boot.error) {
  document.getElementById('src').value = 'sample';
  updateStat(getData());
  addMsg('bot', '你好，我是「乔侨爱学习」问答助手（演示数据）。\n可以问我：广开土木工程学费多少 / 国开畜牧兽医 / 按示例-文老师的风格写一条。\n提示：真实数据需在本机运行 scripts/export_web_data.py 生成。');
} else {
  updateStat(boot);
  addMsg('bot', '你好，我是「乔侨爱学习」问答助手。\n可以问我：广开土木工程学费多少 / 国开畜牧兽医 / 按示例-文老师的风格写一条。');
}

</script>
</body>
</html>
